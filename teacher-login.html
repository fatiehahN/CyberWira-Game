
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Login | CyberWira</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .auth-container {
      max-width: 460px;
      margin: 55px auto;
      padding: 35px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.07);
    }

    .auth-container h1 { margin-bottom: 8px; }
    .auth-subtitle { color: #64748b; margin-bottom: 28px; }

.auth-form label {
  display: block;
  margin: 17px 0 7px;
  font-weight: 600;
  color: #123b65;
}

    .auth-form input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

    .auth-button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #123b65;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-footer {
      margin-top: 22px;
      text-align: center;
      color: #64748b;
    }

    .auth-footer a {
  color: #08d9ed;
  font-weight: 600;
  text-decoration: none;
}

.auth-footer a:hover {
  color: #bd67f5;
  text-decoration: underline;
}
    .back-link { display: block; margin-top: 20px; text-align: center; }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-shield">⬟</span>
      <span class="brand-copy">
        <span class="brand-name">CYBER<span>WIRA</span></span>
        <span class="brand-subtitle">Cybersecurity Awareness &amp; Learning Portal</span>
      </span>
      <span class="brand-tag">TEACHER PORTAL</span>
    </a>
    <nav class="main-nav">
      <a class="nav-link" href="index.html#game">🎮 Play Game</a>
      <a class="nav-link active" href="teacher.html">📊 Teacher Portal</a>
    </nav>
  </header>

  <main class="page-container">
    <section class="auth-container">
      <h1>Teacher Login</h1>
      <p class="auth-subtitle">Sign in to access your CyberWira dashboard.</p>

      <form class="auth-form">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <button type="submit" class="auth-button" id="loginButton">
            Login
        </button>
      </form>

      <p class="auth-footer">
        Don't have an account?
        <a href="teacher-register.html">Register here</a>
      </p>

      <a class="back-link" href="teacher.html">← Back to Teacher Portal</a>
    </section>
  </main>
  <script type="module" src="teacher-login.js"></script>
</body>
</html>
